name: erp-dents-dev

services:
  db:
    image: erp-dents-dev-db
    build: ./ops/postgres
    container_name: erp_dents_db_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: erp-dents-dev-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: erp_dents_api_dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:19443}
      SESSION_COOKIE_NAME: __Host-erp_dents_dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      EXAMS_BASE_PATH: ${EXAMS_BASE_PATH}
      EXAM_MAX_BYTES: ${EXAM_MAX_BYTES:-20971520}
      EXAM_QUOTA_BYTES: ${EXAM_QUOTA_BYTES:-53687091200}
      CLAMAV_HOST: clamav
      TZ: ${TZ}
    volumes:
      - ./apps/api:/app
      - exams_data:${EXAMS_BASE_PATH:-/data/exams}

    depends_on:
      exam-storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --reload"]

  exam-storage-init:
    image: erp-dents-dev-api
    pull_policy: never
    user: "0:0"
    command: ["python", "-m", "scripts.prepare_exam_storage"]
    environment:
      EXAMS_BASE_PATH: ${EXAMS_BASE_PATH:-/data/exams}
    volumes:
      - exams_data:${EXAMS_BASE_PATH:-/data/exams}
    restart: "no"

  clamav:
    image: clamav/clamav:1.4@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - clamav_data:/var/lib/clamav
      - ./ops/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./ops/clamav/healthcheck.sh:/usr/local/bin/erp-clamav-health.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/erp-clamav-health.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  gateway:
    build:
      context: ./ops/nginx
    restart: unless-stopped
    environment:
      EXAM_MAX_BYTES: ${EXAM_MAX_BYTES:-20971520}
    volumes:
      - ./ops/gateway/default.conf.template:/etc/nginx/exam.conf.template:ro
    command:
      - /bin/sh
      - -c
      - >-
        export EXAM_BODY_LIMIT=$$(($${EXAM_MAX_BYTES} + 65536));
        envsubst '$$EXAM_BODY_LIMIT' < /etc/nginx/exam.conf.template > /etc/nginx/conf.d/default.conf;
        exec nginx -g "daemon off;"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: erp_dents_web_dev
    environment:
      VITE_API_URL: ""
      CHOKIDAR_USEPOLLING: "true"
      TZ: ${TZ}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

  edge:
    build:
      context: ./ops/nginx
    restart: unless-stopped
    environment:
      WEB_INTERNAL_PORT: 3000
    volumes:
      - ./ops/tls/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIRECTORY:-./.data/tls/dev}:/etc/erp-tls:ro
    ports:
      - "127.0.0.1:19443:443"
    depends_on:
      - web
      - gateway

volumes:
  clamav_data:
  postgres_data:
  exams_data:
