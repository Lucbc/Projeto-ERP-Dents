# Somente dados fictícios. Configuração independente de desenvolvimento/produção.
name: erp-dents-homolog

services:
  db:
    image: erp-dents-homolog-db
    build: ./ops/postgres
    environment:
      POSTGRES_DB: erp_dents_homolog
      POSTGRES_USER: erp_homolog
      POSTGRES_PASSWORD: ${HOMOLOG_DB_PASSWORD:?Execute scripts/homolog.ps1 primeiro}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_homolog -d erp_dents_homolog"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: erp-dents-homolog-api
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://erp_homolog:${HOMOLOG_DB_PASSWORD}@db:5432/erp_dents_homolog
      PUBLIC_ORIGIN: https://localhost:18443
      SESSION_COOKIE_NAME: __Host-erp_dents_homolog
      JWT_SECRET_KEY: ${HOMOLOG_JWT_SECRET:?Execute scripts/homolog.ps1 primeiro}
      JWT_EXPIRE_MINUTES: 60
      BOOTSTRAP_TOKEN: ${HOMOLOG_BOOTSTRAP_TOKEN:-}
      CORS_ORIGINS: http://localhost:18080,http://127.0.0.1:18080
      EXAMS_BASE_PATH: /data/exams
      EXAM_MAX_BYTES: ${EXAM_MAX_BYTES:-20971520}
      EXAM_QUOTA_BYTES: ${EXAM_QUOTA_BYTES:-53687091200}
      CLAMAV_HOST: clamav
      TZ: America/Sao_Paulo
    volumes:
      - exams_data:/data/exams

    depends_on:
      exam-storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      db:
        condition: service_healthy

  exam-storage-init:
    image: erp-dents-homolog-api
    pull_policy: never
    user: "0:0"
    command: ["python", "-m", "scripts.prepare_exam_storage"]
    environment:
      EXAMS_BASE_PATH: /data/exams
    volumes:
      - exams_data:/data/exams
    restart: "no"

  clamav:
    image: clamav/clamav:1.4@sha256:f156095071757e3838caa50265d65e36cdf7f934a27aacf851ea6d2fadbe8200
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - clamav_data:/var/lib/clamav
      - ./ops/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  gateway:
    image: nginx:stable-alpine@sha256:73c75df4075c918f91017fdda46ad81e55e5af77ba3a64ca3d5014bd9244fe7f
    restart: unless-stopped
    environment:
      EXAM_MAX_BYTES: ${EXAM_MAX_BYTES:-20971520}
    volumes:
      - ./ops/gateway/default.conf.template:/etc/nginx/exam.conf.template:ro
    command:
      - /bin/sh
      - -c
      - >-
        export EXAM_BODY_LIMIT=$$(($${EXAM_MAX_BYTES} + 65536));
        envsubst '$$EXAM_BODY_LIMIT' < /etc/nginx/exam.conf.template > /etc/nginx/conf.d/default.conf;
        exec nginx -g "daemon off;"
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - api

  edge:
    image: nginx:stable-alpine@sha256:73c75df4075c918f91017fdda46ad81e55e5af77ba3a64ca3d5014bd9244fe7f
    restart: unless-stopped
    environment:
      WEB_INTERNAL_PORT: 80
    volumes:
      - ./ops/tls/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIRECTORY:-./.data/tls/homolog}:/etc/erp-tls:ro
    ports:
      - "127.0.0.1:18443:443"
    depends_on:
      - web
      - gateway

volumes:
  clamav_data:
  postgres_data:
  exams_data:
