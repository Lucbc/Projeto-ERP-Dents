name: erp-dents-prod

services:
  db:
    image: erp-dents-prod-db
    build: ./ops/postgres
    container_name: erp_dents_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: erp-dents-prod-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: erp_dents_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN HTTPS}
      SESSION_COOKIE_NAME: __Host-erp_dents_session
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      EXAMS_BASE_PATH: ${EXAMS_BASE_PATH}
      EXAM_MAX_BYTES: ${EXAM_MAX_BYTES:-20971520}
      EXAM_QUOTA_BYTES: ${EXAM_QUOTA_BYTES:-53687091200}
      CLAMAV_HOST: clamav
      TZ: ${TZ}
    volumes:
      - exams_data:${EXAMS_BASE_PATH:-/data/exams}

    depends_on:
      exam-storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      db:
        condition: service_healthy

  exam-storage-init:
    image: erp-dents-prod-api
    pull_policy: never
    user: "0:0"
    command: ["python", "-m", "scripts.prepare_exam_storage"]
    environment:
      EXAMS_BASE_PATH: ${EXAMS_BASE_PATH:-/data/exams}
    volumes:
      - exams_data:${EXAMS_BASE_PATH:-/data/exams}
    restart: "no"

  clamav:
    image: clamav/clamav:1.4@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - clamav_data:/var/lib/clamav
      - ./ops/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./ops/clamav/healthcheck.sh:/usr/local/bin/erp-clamav-health.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/erp-clamav-health.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  gateway:
    image: nginx:stable-alpine@sha256:73c75df4075c918f91017fdda46ad81e55e5af77ba3a64ca3d5014bd9244fe7f
    restart: unless-stopped
    environment:
      EXAM_MAX_BYTES: ${EXAM_MAX_BYTES:-20971520}
    volumes:
      - ./ops/gateway/default.conf.template:/etc/nginx/exam.conf.template:ro
    command:
      - /bin/sh
      - -c
      - >-
        export EXAM_BODY_LIMIT=$$(($${EXAM_MAX_BYTES} + 65536));
        envsubst '$$EXAM_BODY_LIMIT' < /etc/nginx/exam.conf.template > /etc/nginx/conf.d/default.conf;
        exec nginx -g "daemon off;"
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: erp_dents_web
    restart: unless-stopped
    depends_on:
      - api

  edge:
    image: nginx:stable-alpine@sha256:73c75df4075c918f91017fdda46ad81e55e5af77ba3a64ca3d5014bd9244fe7f
    restart: unless-stopped
    environment:
      WEB_INTERNAL_PORT: 80
    volumes:
      - ./ops/tls/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIRECTORY:-./.data/tls/prod}:/etc/erp-tls:ro
    ports:
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - web
      - gateway

volumes:
  clamav_data:
  postgres_data:
  exams_data:
